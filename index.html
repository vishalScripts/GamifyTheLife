        <h1>

      <div id="subjects">
        <!-- Subject sections will be dynamically added here -->
      </div>

      <div class="add-chapter-section">
        <div class="form-section">
          <h3>Add Chapter:</h3>
          <select id="subject-select" class="input"></select>
          <div class="input-container">
            <input
              type="text"
              id="new-chapter"
              class="input"
              placeholder="Enter chapter name..."
            />
          </div>
          <button class="button" onclick="addChapter()">Add Chapter</button>
        </div>

        <div class="form-section">
          <h3>Add Subject:</h3>
          <div class="input-container">
            <input
              type="text"
              id="new-subject"
              class="input"
              placeholder="Add new subject..."
            />
          </div>
          <button class="button" onclick="addSubject()">Add Subject</button>
        </div>
      </div>

      <div class="undo-section">
        <button id="undo-button" onclick="undoAction()" disabled>Undo</button>
      </div>
    </div>

    <button onclick="toggleDarkMode()">Toggle Dark Mode</button>
